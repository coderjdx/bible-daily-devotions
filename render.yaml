# Render Blueprint Specification for Daily Devotions
# Free Tier Static Site Deployment
services:
  - type: web
    name: daily-devotions
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /data/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /icons/*
        name: Cache-Control
        value: public, max-age=604800
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
